name: Import macOS signing identity
description: Import a PKCS#12 certificate into a temporary keychain and resolve its code signing identity.
inputs:
  certificate:
    description: Base64-encoded PKCS#12 bundle (CSC_LINK). Empty skips the import.
    required: false
    default: ""
  password:
    description: Password of the bundle (CSC_KEY_PASSWORD)
    required: false
    default: ""
outputs:
  identity:
    description: Name of the imported code signing identity, empty when nothing was imported
    value: ${{ steps.import.outputs.identity }}
runs:
  using: composite
  steps:
    - id: import
      shell: bash
      env:
        CERTIFICATE: ${{ inputs.certificate }}
        PASSWORD: ${{ inputs.password }}
      run: |
        set -euo pipefail
        if [[ -z "$CERTIFICATE" || -z "$PASSWORD" ]]; then
          echo "No macOS signing certificate configured; builds are signed ad hoc."
          echo "identity=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        keychain="$RUNNER_TEMP/mac-signing.keychain-db"
        # The CLI archive and desktop steps of one job both import; the second run reuses the keychain.
        if [[ ! -f "$keychain" ]]; then
          keychain_password="$(openssl rand -hex 16)"
          echo "::add-mask::$keychain_password"
          bundle="$RUNNER_TEMP/mac-signing.p12"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$bundle"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$bundle" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate is only a valid identity once the system trusts it as a root.
          leaf="$RUNNER_TEMP/mac-signing-leaf.pem"
          security find-certificate -p "$keychain" > "$leaf"
          if [[ "$(openssl x509 -in "$leaf" -noout -subject)" == "$(openssl x509 -in "$leaf" -noout -issuer | sed 's/^issuer=/subject=/')" ]]; then
            sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$leaf"
          fi
        fi
        identity="$(security find-identity -v -p codesigning "$keychain" | sed -n '1s/^[^"]*"\(.*\)".*$/\1/p')"
        if [[ -z "$identity" ]]; then
          echo "The certificate holds no valid code signing identity." >&2
          exit 1
        fi
        echo "identity=$identity" >> "$GITHUB_OUTPUT"
        echo "macOS signing identity: $identity"
